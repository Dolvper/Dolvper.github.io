<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Interactivo</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #e0e7ff;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      display: grid;
      grid-template-columns: 1fr 320px;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Sección del Calendario */
    .calendar-section {
      padding: 24px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--accent);
      color: var(--primary);
      border-color: var(--primary);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      position: relative;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .day:hover:not(.empty) {
      background-color: var(--bg);
      border-color: var(--border);
    }

    .day.empty {
      cursor: default;
    }

    .day.today {
      font-weight: 700;
      color: var(--primary);
      border-color: var(--primary);
    }

    .day.selected {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    .event-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
    }

    .day.selected .event-dot {
      background-color: white;
    }

    /* Panel de Eventos */
    .events-panel {
      background: var(--bg);
      padding: 24px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel-header {
      margin-bottom: 16px;
    }

    .selected-date-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .events-list {
      list-style: none;
      overflow-y: auto;
      max-height: 280px;
      flex-grow: 1;
      margin-bottom: 16px;
    }

    .event-item {
      background: var(--card);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      padding: 0 4px;
    }

    .no-events {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
    }

    .add-event-form {
      display: flex;
      gap: 8px;
    }

    .add-event-form input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .add-event-form input:focus {
      border-color: var(--primary);
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Calendario -->
    <div class="calendar-section">
      <div class="calendar-header">
        <div class="month-title" id="monthDisplay"></div>
        <div class="nav-buttons">
          <button class="btn-icon" id="prevBtn" title="Mes anterior">&#8592;</button>
          <button class="btn-icon" id="todayBtn">Hoy</button>
          <button class="btn-icon" id="nextBtn" title="Mes siguiente">&#8594;</button>
        </div>
      </div>

      <div class="weekdays">
        <div>Lun</div>
        <div>Mar</div>
        <div>Mié</div>
        <div>Jue</div>
        <div>Vie</div>
        <div>Sáb</div>
        <div>Dom</div>
      </div>

      <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- Panel de Eventos -->
    <div class="events-panel">
      <div>
        <div class="panel-header">
          <div class="selected-date-title" id="selectedDateText">Selecciona un día</div>
        </div>
        <ul class="events-list" id="eventsList"></ul>
      </div>

      <form class="add-event-form" id="eventForm">
        <input type="text" id="eventInput" placeholder="Nuevo evento..." required>
        <button type="submit" class="btn-add">+</button>
      </form>
    </div>
  </div>

  <script>
    const monthDisplay = document.getElementById('monthDisplay');
    const daysGrid = document.getElementById('daysGrid');
    const selectedDateText = document.getElementById('selectedDateText');
    const eventsList = document.getElementById('eventsList');
    const eventForm = document.getElementById('eventForm');
    const eventInput = document.getElementById('eventInput');

    let currentDate = new Date();
    let selectedDate = new Date();
    
    // Cargar eventos desde localStorage
    let events = JSON.parse(localStorage.getItem('calendarEvents')) || {};

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderCalendar() {
      daysGrid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Mostrar mes y año
      const monthName = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(currentDate);
      monthDisplay.textContent = monthName;

      // Primer día del mes (ajustado para que Lunes sea el primer día: 0)
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Celdas vacías previas
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.classList.add('day', 'empty');
        daysGrid.appendChild(emptyDiv);
      }

      const todayKey = formatDateKey(new Date());
      const selectedKey = formatDateKey(selectedDate);

      // Días del mes
      for (let day = 1; day <= daysInMonth; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.textContent = day;

        const cellDate = new Date(year, month, day);
        const cellKey = formatDateKey(cellDate);

        if (cellKey === todayKey) dayDiv.classList.add('today');
        if (cellKey === selectedKey) dayDiv.classList.add('selected');

        // Punto indicador si hay eventos
        if (events[cellKey] && events[cellKey].length > 0) {
          const dot = document.createElement('div');
          dot.classList.add('event-dot');
          dayDiv.appendChild(dot);
        }

        dayDiv.addEventListener('click', () => {
          selectedDate = cellDate;
          renderCalendar();
          renderEvents();
        });

        daysGrid.appendChild(dayDiv);
      }
    }

    function renderEvents() {
      const key = formatDateKey(selectedDate);
      const dateStr = new Intl.DateTimeFormat('es-ES', { dateStyle: 'full' }).format(selectedDate);
      selectedDateText.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

      eventsList.innerHTML = '';
      const dayEvents = events[key] || [];

      if (dayEvents.length === 0) {
        eventsList.innerHTML = '<li class="no-events">No hay eventos para este día.</li>';
        return;
      }

      dayEvents.forEach((evt, index) => {
        const li = document.createElement('li');
        li.classList.add('event-item');
        
        const span = document.createElement('span');
        span.textContent = evt;

        const delBtn = document.createElement('button');
        delBtn.innerHTML = '&times;';
        delBtn.classList.add('delete-btn');
        delBtn.title = 'Eliminar evento';
        delBtn.onclick = () => deleteEvent(key, index);

        li.appendChild(span);
        li.appendChild(delBtn);
        eventsList.appendChild(li);
      });
    }

    function saveEvents() {
      localStorage.setItem('calendarEvents', JSON.stringify(events));
    }

    function deleteEvent(key, index) {
      events[key].splice(index, 1);
      if (events[key].length === 0) {
        delete events[key];
      }
      saveEvents();
      renderCalendar();
      renderEvents();
    }

    eventForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = eventInput.value.trim();
      if (!text) return;

      const key = formatDateKey(selectedDate);
      if (!events[key]) events[key] = [];
      events[key].push(text);

      eventInput.value = '';
      saveEvents();
      renderCalendar();
      renderEvents();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      selectedDate = new Date();
      renderCalendar();
      renderEvents();
    });

    // Inicializar
    renderCalendar();
    renderEvents();
  </script>
</body>
</html>
